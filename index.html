<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dive Computer</title>
    <link href="https://fonts.googleapis.com/css2?family=Coiny&display=swap" rel="stylesheet">

    <style>
        h1 {
            text-align: center;
        }
        .bubbleFont {
            font-family: "Coiny", system-ui;
            font-style: normal;

            /* gives the letters a gradient like light hitting a bubble */
            background: linear-gradient(180deg, #3549ff 0%, #005aa3 50%, #002f51 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;

            filter: drop-shadow(2px 6px 4px rgba(195, 251, 255, 0.6));
                
        }
        body {
            /* Replace with your image file path or web URL */
            background-image: url('https://static.vecteezy.com/system/resources/thumbnails/038/000/283/small/ai-generated-sunlight-illuminating-the-surface-and-depths-of-the-blue-ocean-capturing-the-essence-of-summer-with-clear-waters-and-gentle-sea-waves-photo.jpg');     
            /* Prevents the image from repeating like a tile grid */
            background-repeat: no-repeat;       
            /* Scales the image to fit and completely cover the screen */
            background-size: cover;          
            /* Centers the image horizontally and vertically */
            background-position: center;      
            /* Keeps the background fixed in place while scrolling */
            background-attachment: fixed; 
        }

    </style>
</head>
<body>
    <header>
        <h1 class="bubbleFont" style="font-size: 4rem; margin-top: 2rem;">
            Dive Computer
        </h1>
    </header>

    <main>
        <section tag="movingDiver">
            <div id="waterContainer" style="position: relative; height: 400px;">
                <img id="diver" src="diver.png" style="position: absolute; left: 10%; transform: translateX(-50%); width: 110px;">
            </div>

            <input type="range" id="depthSlider" min="35" max="140" value="35" style="accent-color: #bd15ff;">
            <p id="depthLabel" style="font-family: Coiny; font-size: large; color: #ffffff;">Depth: 35 ft</p>
        </section>
        
    </main>
    <script src="diveLogic.js"></script>
</body>
</html>
