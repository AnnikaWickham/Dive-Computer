<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dive Computer</title>
    <link href="https://fonts.googleapis.com/css2?family=Coiny&display=swap" rel="stylesheet">

    <style>
        * {
            outline: 1px solid red !important;
        }

        h1 {
            text-align: center;
        }

        .bubbleFont {
            font-family: "Coiny", system-ui;
            font-style: normal;

            /* gives the letters a gradient like light hitting a bubble */
            background: linear-gradient(180deg, #3549ff 0%, #005aa3 50%, #002f51 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;

            filter: drop-shadow(2px 6px 4px rgba(195, 251, 255, 0.6));
                
        }

        body {
            /* Replace with your image file path or web URL */
            background-image: url('https://static.vecteezy.com/system/resources/thumbnails/038/000/283/small/ai-generated-sunlight-illuminating-the-surface-and-depths-of-the-blue-ocean-capturing-the-essence-of-summer-with-clear-waters-and-gentle-sea-waves-photo.jpg');     
            /* Prevents the image from repeating like a tile grid */
            background-repeat: no-repeat;       
            /* Scales the image to fit and completely cover the screen */
            background-size: cover;          
            /* Centers the image horizontally and vertically */
            background-position: center;      
            /* Keeps the background fixed in place while scrolling */
            background-attachment: fixed; 
        }

        .header-container {
            display: flex; /* Lines up elements in a single horizontal row */
            align-items: center; /* Vertically centers the buttons with the text */
            justify-content: space-between; /* Pushes buttons to edges and centers the title */
            gap: 15px; /* Adds clean spacing between elements so they don't touch */
        }

        .tabButton {
            outline: 0.5px solid #4a90c2;
            border: 0.5px solid #4a90c2;
            cursor: pointer;
            font-family: Coiny; 
            font-size: large; 
            color: #e8fdff; 
            background-color: #202042; 
            padding: 5px 25px; 
            border-radius: 5px; 
            margin-top: 0rem; 
        }

        .tabButton.active {
            outline: 2px solid #4a90c2;
            border: 0.5px solid #4a90c2;
            font-family: Coiny; 
            font-size: large; 
            color: #e8fdff; 
            background-color: #0b0b71; 
            padding: 5px 25px; 
            border-radius: 5px; 
            margin-top: 0rem; 
        }

    </style>
</head>
<body>
    <header>
        <div class="header-container" style="height: 4rem; width: 100%;">
            <button type="button" id="singleDiveBtn" class="tabButton active" style="margin-left: 2rem">Single Dive</button>
            <h1 class="bubbleFont" style="font-size: 3rem; margin-top: 2rem;">Dive Planner</h1>
            <button type="button" id="multiDiveBtn" class="tabButton" style="margin-right: 2rem;">Multi Dive</button>
        </div>     
    </header>

    <main>
        <section id="singleDive">
            <section tag="movingDiver">
                <div id="waterContainer" style="position: relative; height: 500px;">
                    <img id="diver" src="diver.png" style="position: absolute; left: 6%; transform: translateX(-50%); width: 110px;">
                    <div class="header-container" style="height: 4rem; width: 30%; margin: auto;">
                        <p style="font-family: Coiny; font-size: 2rem; color: #ffffff;">Dive Time</p>
                        <div style="display: flex; flex-direction: column;">
                            <label for="hours" style="font-family: Coiny; font-size: 1rem; color: #ffffff;">Hours:&nbsp&nbsp&nbsp&nbsp&nbsp<input type="number" id="hrIN" style="border-radius: 4px; border-color: #4a90c2; color: #002f51;" min="0" max="99" placeholder="0" required></label>
                            <label for="minutes" style="font-family: Coiny; font-size: 1rem; color: #ffffff;">Minutes: <input type="number" id="minIN" style="border-radius: 4px; border-color: #4a90c2; color: #002f51;" min="0" max="59" placeholder="00" required></label>
                        </div>
                    </div>
                    <div class="header-container" style="height: 4rem; width: 30%; margin: auto;">
                        <p id="ndlLabel" style="font-family: Coiny; font-size: 2rem; color: #ffffff;">NDL: 0 mins</p>
                    </div>
                    <div class="header-container" style="height: 4rem; width: 30%; margin: auto;">
                        <p id="ssLabel" style="font-family: Coiny; font-size: 1.5rem; color: #ffffff;">Safety Stop Recommended</p>
                    </div>
                </div>
                <input type="range" id="depthSlider" name="depth" min="35" max="140" value="35" style="accent-color: #bd15ff;">
                <p id="depthLabel" style="font-family: Coiny; font-size: large; color: #ffffff;">Depth: 35 ft</p>
            </section>
        </section>

        <section id="multiDive">

        </section>

        <a href="https://a1scubadiving.com/wp-content/uploads/2018/06/PADI-Recreational-Dive-Table-Planner.pdf" class="tabButton" target="_blank" style="position: absolute; bottom: 10px; right: 10px;">PADI Dive Tables</a>

    </main>
    <script src="diveLogic.js"></script>
</body>
</html>
